name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, docs, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel and pulls in clippy and rustfmt,
      # so the first cargo invocation installs everything this job needs.
      - name: Toolchain
        run: cargo --version --verbose && rustc --version && cargo clippy --version

      - name: Format
        run: cargo fmt --all --check

      # Both feature configurations, because `cli` is opt-in and the library
      # target must keep building without it (SCOPE.md 10, D13).
      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (cli)
        run: cargo clippy --all-targets --features cli -- -D warnings

      # The only check that catches a broken intra-doc link. Nothing else here
      # runs rustdoc, and `deny(missing_docs)` does not imply the links resolve.
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

      # The generator round-trip samples seeds and caps output length by default, so that a
      # local `cargo test` stays quick. CI runs what M3 actually asks for: 200 seeds per rule,
      # with no cap on how long a generated string may get.
      # The declared MSRV is a promise, and an unchecked promise drifts. This caught the
      # opposite problem in M4.3: the crate claimed 1.97 and actually built on 1.88.
      - name: Install MSRV toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Build and test on the MSRV
        run: cargo +1.88.0 test --features cli

      - name: Test (default features)
        env:
          ABNF_ORACLE_SEEDS: 200
          ABNF_ORACLE_MAX_LEN: none
        run: cargo test --release

      - name: Test (cli)
        run: cargo test --features cli
